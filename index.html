<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com Bootstrap</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="h1">Cadastro de Clientes</h1>
        <div class="row g-0">
            <div class="col g-0">
                <form>
                    <label class="form-label" for="nome">Nome:</label>
                    <input class="form-control campo-formulario" type="text" id="nome">
                    <label class="form-label" for="email">Email:</label>
                    <input class="form-control campo-formulario" type="text" id="email">
                    <label class="form-label" for="telefone">Telefone:</label>
                    <input class="form-control campo-formulario" type="text" id="telefone">
                </form>
                <button class="btn btn-success">Enviar</button>
            </div>
        </div>
    </div>
</body>
</html>
